<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1: квалификации и гонки</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<style>
:root{--bg:#0f1016;--ink:#eef0f6;--mute:#9aa1b6;--glass:rgba(255,255,255,.055);--edge:rgba(255,255,255,.11);--line:rgba(255,255,255,.08);--red:#ff2d3d;--yel:#ffd23f;--grey:#6f768a;--tint:rgba(255,45,61,.16);--tint2:rgba(0,210,190,.12);--navbg:rgba(22,24,34,.72);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#eceff5;--ink:#0f1220;--mute:#5b6378;--glass:rgba(255,255,255,.72);--edge:rgba(15,18,32,.12);--line:rgba(15,18,32,.1);--red:#dc0000;--yel:#d9a400;--grey:#8a92a6;--tint:rgba(220,0,0,.1);--tint2:rgba(0,210,190,.14);--navbg:rgba(255,255,255,.8);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);background:radial-gradient(70% 40% at 0% 0%,var(--tint),transparent 70%),radial-gradient(70% 40% at 100% 8%,var(--tint2),transparent 70%),repeating-linear-gradient(45deg,rgba(255,255,255,.016) 0 2px,transparent 2px 7px),var(--bg);background-attachment:fixed;font:16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1,h2,.big,.pts{font-family:Unbounded,Onest,system-ui,sans-serif}
h1{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:10px 0 8px}
h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
.next{display:grid;gap:12px;margin-bottom:10px}
.cd,.gp{background:var(--glass);border:1px solid var(--edge);border-radius:22px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 32px -14px rgba(0,0,0,.65)}
.cd{--ac:var(--yel);position:relative;padding:16px 18px 16px 26px;overflow:hidden;border-color:color-mix(in srgb,var(--ac) 38%,var(--edge))}
.cd.race{--ac:var(--red)}
.cd::before{content:"";position:absolute;left:10px;top:16px;bottom:16px;width:4px;border-radius:4px;background:linear-gradient(var(--ac),transparent);box-shadow:0 0 14px var(--ac)}
.cd p{margin:0;color:var(--mute);font-size:14px}
.cd b{color:var(--ink);font-weight:600}
.big{font-size:clamp(25px,8.2vw,37px);font-weight:700;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.lt{display:inline-flex;gap:8px;background:rgba(0,0,0,.55);border:1px solid var(--edge);padding:8px 12px;border-radius:999px;margin:10px 0 8px}
.lt i{width:20px;height:20px;border-radius:50%;background:#2b2f3a}
.lt i.on{background:#ff2a3d;box-shadow:0 0 12px #ff2a3d}
.gp{margin-top:16px;overflow:hidden}
.gh{position:relative;padding:20px 16px 12px;border-bottom:1px solid var(--line)}
.gh::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);box-shadow:0 0 14px var(--red)}
.gh p{margin:3px 0 0;color:var(--mute);font-size:14px}
.s{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:11px 16px;border-left:4px solid var(--grey);border-bottom:1px solid var(--line)}
.s:last-child{border-bottom:0}
.s.q{border-left-color:var(--yel);font-weight:600}
.s.r{border-left-color:var(--red);font-weight:600}
.s .tr{grid-column:1/3;color:var(--mute);font-size:13px;font-weight:400}
.s.past{opacity:.4}
.s.past .t{text-decoration:line-through}
.t{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--mute);font-size:13px;margin-top:20px}
.pad{padding:12px 16px}
.pad p{margin:4px 0}
.pad .m{color:var(--mute);font-size:14px}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:3px 10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rk{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.nm b{font-weight:600}
.nm span{display:block;color:var(--mute);font-size:13px}
.pts{font-weight:700;font-variant-numeric:tabular-nums}
.bar{grid-column:2/4;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;box-shadow:0 0 10px currentColor}
.seg{display:flex;gap:6px;margin:0 0 14px}
.seg button{flex:1;font:inherit;font-size:13px;font-weight:600;padding:9px 4px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;display:flex;gap:4px;padding:6px;background:var(--navbg);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--edge);border-radius:24px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
nav button{flex:1;font:inherit;font-size:12px;font-weight:600;background:none;border:0;color:var(--mute);padding:11px 2px;border-radius:18px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav button:focus-visible,.seg button:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
</style>
</head>
<body>
<main id="app"></main>
<nav><button data-t="sch">Расписание</button><button data-t="std">Зачёт</button><button data-t="live">Live</button><button data-t="trk">Трассы</button><button data-t="news">Новости</button></nav>
<script>
var GPS = [
  {n: "Гран-при Лас-Вегаса", f: "🇺🇸", c: "Лас-Вегас, США", tz: "America/Los_Angeles", s: [["p", "Практика 1", "2026-11-20T00:30:00Z"], ["p", "Практика 2", "2026-11-20T04:00:00Z"], ["p", "Практика 3", "2026-11-21T00:30:00Z"], ["q", "Квалификация", "2026-11-21T04:00:00Z"], ["r", "Гонка", "2026-11-22T04:00:00Z"]]},
  {n: "Гран-при Катара", f: "🇶🇦", c: "Лусаил, Катар", tz: "Asia/Qatar", s: [["p", "Практика 1", "2026-11-27T13:30:00Z"], ["p", "Практика 2", "2026-11-27T17:00:00Z"], ["p", "Практика 3", "2026-11-28T14:30:00Z"], ["q", "Квалификация", "2026-11-28T18:00:00Z"], ["r", "Гонка", "2026-11-29T16:00:00Z"]]},
  {n: "Гран-при Абу-Даби", f: "🇦🇪", c: "Яс-Марина, ОАЭ · финал сезона", tz: "Asia/Dubai", s: [["p", "Практика 1", "2026-12-04T09:30:00Z"], ["p", "Практика 2", "2026-12-04T13:00:00Z"], ["p", "Практика 3", "2026-12-05T10:30:00Z"], ["q", "Квалификация", "2026-12-05T14:00:00Z"], ["r", "Гонка", "2026-12-06T13:00:00Z"]]}
];
var MYTZ = "";
try { MYTZ = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
function fmt(t, tz) {
  var o = {weekday: "short", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"};
  if (tz) o.timeZone = tz;
  return new Date(t).toLocaleString("ru-RU", o);
}
function cd(ms) {
  var s = Math.max(0, Math.floor(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  function p(n) { return String(n).padStart(2, "0"); }
  return (d ? d + " дн " : "") + p(h) + ":" + p(m) + ":" + p(x);
}
function nextOf(type, now) {
  for (var i = 0; i < GPS.length; i++) for (var j = 0; j < GPS[i].s.length; j++) {
    var e = GPS[i].s[j], t = Date.parse(e[2]);
    if (e[0] === type && t > now) return {g: GPS[i], t: t};
  }
  return null;
}
function lights(ms) {
  var h = ms / 36e5, k = h < 1 ? 5 : h < 6 ? 4 : h < 24 ? 3 : h < 72 ? 2 : 1, o = "<div class='lt' aria-hidden='true'>";
  for (var i = 1; i <= 5; i++) o += "<i" + (i <= k ? " class='on'" : "") + "></i>";
  return o + "</div>";
}
function block(cls, label, n, now) {
  if (!n) return "";
  return "<div class='cd " + cls + "'><p>" + label + " · " + n.g.f + " " + n.g.n + "</p>" + lights(n.t - now) + "<div class='big'>" + cd(n.t - now) + "</div><p><b>" + fmt(n.t) + "</b></p></div>";
}
function viewSchedule() {
  var now = Date.now(), nq = nextOf("q", now), nr = nextOf("r", now);
  var h = "<h1>F1: когда гонки</h1><p class='sub'>Три последних уик-энда сезона 2026. Время показано по вашим часам" + (MYTZ ? " (" + MYTZ + ")" : "") + ".</p>";
  if (!nq && !nr) h += "<div class='cd'><p>Сезон 2026 завершён. Ждите календарь на следующий год.</p></div>";
  else h += "<div class='next'>" + block("", "До квалификации", nq, now) + block("race", "До гонки", nr, now) + "</div>";
  GPS.forEach(function (g) {
    h += "<section class='gp'><div class='gh'><h2>" + g.f + " " + g.n + "</h2><p>" + g.c + "</p></div>";
    g.s.forEach(function (e) {
      var t = Date.parse(e[2]);
      h += "<div class='s " + e[0] + (t < now ? " past" : "") + "'><span>" + e[1] + "</span><span class='t'>" + fmt(t) + "</span><span class='tr'>на трассе: " + fmt(t, g.tz) + "</span></div>";
    });
    h += "</section>";
  });
  h += "<p class='note'>Цвет полоски как у шин: серая — практика, жёлтая — квалификация, красная — гонка. Время пересчитано из GMT, расписание могут изменить: сверяйтесь с formula1.com.</p>";
  return h;
}
var tab = "sch";
var TRACKS = [
  {n: "🇺🇸 Лас-Вегас", c: "Las Vegas Strip Circuit", m: "6,201 км · 50 кругов", d: "Городская трасса по улицам Лас-Вегаса. Гонка проходит в субботу вечером по местному времени, старт в 20:00."},
  {n: "🇶🇦 Лусаил", c: "Lusail International Circuit", m: "5,419 км · 57 кругов", d: "Быстрая трасса в Катаре, гонка идёт под прожекторами. По нагрузке на пилотов её сравнивают с Сингапуром из-за жары."},
  {n: "🇦🇪 Яс-Марина", c: "Yas Marina Circuit", m: "5,281 км · 58 кругов", d: "Трасса в Абу-Даби, где с 2009 года проходит финал сезона. Гонка стартует в сумерках."}
];
function card(t, m, d) { return "<section class='gp'><div class='gh'><h2>" + t + "</h2></div><div class='pad'>" + (m ? "<p class='m'>" + m + "</p>" : "") + "<p>" + d + "</p></div></section>"; }
var TC = {MER: "#00d2be", FER: "#dc0000", RBR: "#3671c6", MCL: "#ff8700", RB: "#6692ff", ALP: "#ff6fb5", HAA: "#b6babd", AUD: "#f50537", WIL: "#1a9bff", AM: "#00a38f", CAD: "#8b93a5"};
var DRV = [["Кими Антонелли", "Mercedes", "MER", 390], ["Макс Ферстаппен", "Red Bull", "RBR", 279], ["Джордж Расселл", "Mercedes", "MER", 262], ["Льюис Хэмилтон", "Ferrari", "FER", 261], ["Шарль Леклер", "Ferrari", "FER", 249], ["Ландо Норрис", "McLaren", "MCL", 246], ["Оскар Пиастри", "McLaren", "MCL", 152], ["Иссак Хаджар", "Red Bull", "RBR", 122], ["Лиам Лоусон", "Racing Bulls", "RB", 89], ["Пьер Гасли", "Alpine", "ALP", 42], ["Арвид Линдблад", "Racing Bulls", "RB", 38], ["Франко Колапинто", "Alpine", "ALP", 27], ["Оливер Бирман", "Haas", "HAA", 23], ["Габриэл Бортолето", "Audi", "AUD", 14], ["Нико Хюлькенберг", "Audi", "AUD", 14], ["Эстебан Окон", "Haas", "HAA", 7], ["Фернандо Алонсо", "Aston Martin", "AM", 7], ["Карлос Сайнс", "Williams", "WIL", 7], ["Александер Элбон", "Williams", "WIL", 5], ["Юки Цунода", "Racing Bulls", "RB", 1], ["Рё Хиракава", "Haas", "HAA", 1], ["Лэнс Стролл", "Aston Martin", "AM", 0], ["Валттери Боттас", "Cadillac", "CAD", 0], ["Серхио Перес", "Cadillac", "CAD", 0], ["Рафаэл Камара", "Haas", "HAA", 0]];
var TEAMS = [["Mercedes", "MER", 652, 0], ["Ferrari", "FER", 512, 0], ["Red Bull", "RBR", 415, 0], ["McLaren", "MCL", 398, 0], ["Racing Bulls", "RB", 112, 0], ["Alpine", "ALP", 69, 1], ["Haas", "HAA", 31, 1], ["Audi", "AUD", 27, 1], ["Williams", "WIL", 12, 1], ["Aston Martin", "AM", 7, 1], ["Cadillac", "CAD", 0, 1]];
var BRA = [["Ландо Норрис", "McLaren", "MCL", 25], ["Макс Ферстаппен", "Red Bull", "RBR", 18], ["Иссак Хаджар", "Red Bull", "RBR", 15], ["Джордж Расселл", "Mercedes", "MER", 12], ["Кими Антонелли", "Mercedes", "MER", 10]];
var sub = "drv";
function row(n, name, team, pts, color, max, mark) {
  return "<div class='row'><span class='rk'>" + n + "</span><span class='nm'><b>" + name + "</b>" + (team ? "<span>" + team + "</span>" : "") + "</span><span class='pts'>" + pts + (mark ? "*" : "") + "</span><div class='bar'><i style='width:" + Math.max(1, pts / max * 100) + "%;background:" + color + ";color:" + color + "'></i></div></div>";
}
function viewStand() {
  var h = "<h1>Зачёт</h1><p class='sub'>После Гран-при Бразилии (8 ноября). Чемпион мира — Кими Антонелли, Кубок конструкторов — Mercedes.</p><div class='seg'>";
  [["drv", "Пилоты"], ["team", "Команды"], ["race", "За гонку"]].forEach(function (x) { h += "<button data-s='" + x[0] + "' aria-pressed='" + (sub === x[0]) + "'>" + x[1] + "</button>"; });
  h += "</div>";
  if (sub === "drv") {
    h += "<section class='gp'>" + DRV.map(function (d, i) { return row(i + 1, d[0], d[1], d[3], TC[d[2]], 390); }).join("") + "</section><p class='note'>Очки за сезон. Данные сверены по нескольким сайтам. У Франко Колапинто в одном источнике указано 33 очка, в остальных 27.</p>";
  } else if (sub === "team") {
    h += "<section class='gp'>" + TEAMS.map(function (t, i) { return row(i + 1, t[0], "", t[2], TC[t[1]], 652, t[3]); }).join("") + "</section><p class='note'>Очки команд за сезон. * Данные до Гран-при Бразилии. После гонок команды могут терять или получать пару очков из-за штрафов, поэтому сумма очков пилотов иногда отличается.</p>";
  } else {
    h += "<h2 style='margin:0 0 10px'>Гран-при Бразилии: первая пятёрка</h2><section class='gp' style='margin-top:0'>" + BRA.map(function (d, i) { return row(i + 1, d[0], d[1], d[3], TC[d[2]], 25); }).join("") + "</section>" +
      card("Очки за место в гонке", "", "1-е место: 25, 2-е: 18, 3-е: 15, 4-е: 12, 5-е: 10, 6-е: 8, 7-е: 6, 8-е: 4, 9-е: 2, 10-е: 1. Очки команды равны сумме очков двух её пилотов.") +
      "<p class='note'>Полную таблицу очков каждого пилота по каждой гонке сезона здесь пока не показываем: надёжного источника целиком у нас нет. Подключим через сервер.</p>";
  }
  return h;
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
var TIRE = {SOFT: "#e10600", MEDIUM: "#d9a400", HARD: "#8a8a99", INTERMEDIATE: "#1f9d55", WET: "#1d6fe0"};
var TIRE_RU = {SOFT: "мягкие", MEDIUM: "средние", HARD: "жёсткие", INTERMEDIATE: "интер", WET: "дождевые"};
function viewLive() {
  return "<h1>Live</h1><p class='sub'>Позиции, отрывы и шины пилотов из OpenF1.</p><div id='lc'></div><div id='lv'><p class='note'>Загрузка…</p></div>";
}
function tickLive() {
  var el = document.getElementById("lc");
  if (!el) return;
  var now = Date.now(), best = null;
  GPS.forEach(function (g) { g.s.forEach(function (e) { var t = Date.parse(e[2]); if (t > now && (!best || t < best.t)) best = {g: g, e: e, t: t}; }); });
  el.innerHTML = best ? "<div class='cd'><p>Ближайшая сессия · " + best.g.f + " " + best.g.n + "</p><div class='big'>" + cd(best.t - now) + "</div><p><b>" + best.e[1] + ", " + fmt(best.t) + "</b></p></div>" : "";
}
function loadLive() {
  fetch("/api/live").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    var el = document.getElementById("lv");
    if (!el) return;
    if (!d.session) { el.innerHTML = "<p class='note'>Данных о сессиях пока нет.</p>"; return; }
    var h = "<p class='sub' style='margin-top:14px'>" + (d.session.live ? "Идёт сейчас: " : "Последняя сессия: ") + esc(d.session.name) + ", " + esc(d.session.country) + (d.stale ? " · данные могли устареть" : "") + "</p><section class='gp'>";
    d.drivers.forEach(function (x) {
      h += "<div class='s' style='border-left-color:" + esc(x.color) + "'><span><b>" + x.position + "</b> " + esc(x.code) + " <span style='color:var(--mute);font-size:13px;font-weight:400'>" + esc(x.team) + "</span></span><span class='t'>" + esc(x.gap) + " · <span style='color:" + (TIRE[x.tire] || "var(--mute)") + "'>" + (TIRE_RU[x.tire] || "—") + "</span></span></div>";
    });
    el.innerHTML = h + "</section>";
  }).catch(function () {
    var el = document.getElementById("lv");
    if (el) el.innerHTML = "<p class='note'>Нет связи с сервером. Запустите его командой npm start.</p>";
  });
}
function viewTracks() {
  var h = "<h1>Трассы</h1><p class='sub'>Три последних этапа сезона.</p>";
  TRACKS.forEach(function (t) { h += card(t.n + " · " + t.c, t.m, t.d); });
  return h;
}
function viewNews() {
  return "<h1>Новости</h1><p class='sub'>Главное за последние недели.</p>" +
    card("Антонелли — чемпион мира", "Мехико, конец октября", "Кими Антонелли выиграл титул 2026 года и стал самым молодым чемпионом за всю историю Формулы 1.") +
    card("Mercedes выиграл Кубок конструкторов", "Сан-Паулу, 8 ноября", "Рассел и Антонелли финишировали четвёртым и пятым, этого хватило для титула. Ferrari в гонке заняла седьмое и девятое места.") +
    card("Норрис выиграл Гран-при Бразилии", "Сан-Паулу, 8 ноября", "Для Ландо Норриса это вторая победа подряд на трассе в Интерлагосе.") +
    "<p class='note'>По материалам speedcafe.com, gpfans.com и racingnews365.com.</p>";
}
function render() {
  var v = tab === "sch" ? viewSchedule() : tab === "std" ? viewStand() : tab === "live" ? viewLive() : tab === "trk" ? viewTracks() : viewNews();
  document.getElementById("app").innerHTML = v;
  if (tab === "live") { tickLive(); loadLive(); }
  document.querySelectorAll("nav button").forEach(function (b) { b.setAttribute("aria-current", b.dataset.t === tab ? "true" : "false"); });
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-s]");
  if (!b) return;
  sub = b.dataset.s; render();
});
document.querySelector("nav").addEventListener("click", function (e) {
  var b = e.target.closest("button");
  if (!b) return;
  tab = b.dataset.t; render(); window.scrollTo(0, 0);
});
render();
setInterval(function () { if (tab === "sch") render(); else if (tab === "live") tickLive(); }, 1000);
setInterval(function () { if (tab === "live") loadLive(); }, 10000);
