<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1016">
  <title>F1 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app">
    <header class="top"><span class="eyebrow">FORMULA 1 · 2026</span><div class="actions"><button id="team" class="ghost" aria-label="Выбрать команду">🏁</button><button id="theme" class="ghost" aria-label="Переключить тему">◐</button></div></header>
    <div id="content"><div class="loading">Загружаем паддок…</div></div>
  </main>
  <nav class="nav" aria-label="Главная навигация">
    <button data-tab="schedule" class="active"><span>▦</span>Расписание</button>
    <button data-tab="standings"><span>♜</span>Зачёт</button>
    <button data-tab="live"><span>◉</span>Live</button>
    <button data-tab="tracks"><span>⌁</span>Трассы</button>
    <button data-tab="news"><span>▤</span>Новости</button>
    <button data-tab="chat"><span>✉</span>Чат</button>
  </nav>
  <script src="/app.js"></script>
</body>
</html>
