<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f1">
  <title>F1 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
  <script>try{if(localStorage.getItem("f1theme")!=="dark")document.documentElement.classList.add("light")}catch(e){document.documentElement.classList.add("light")}</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="F1 2026">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="app">
    <header class="top"><div class="brand"><img class="logo" src="/logo-f1.png" alt="F1"><span class="eyebrow">Сезон 2026</span></div><div class="actions"><button id="install" class="ghost" hidden aria-label="Установить приложение">⬇</button><button id="team" class="ghost" aria-label="Выбрать команду">🏁</button><button id="theme" class="ghost" aria-label="Переключить тему">◐</button></div></header>
    <div id="content"><div class="loading">Загружаем паддок…</div></div>
  </main>
  <nav class="nav" aria-label="Главная навигация">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19v-8z"/></svg>Главная</button>
    <button data-tab="community"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 4v-4h-.5A1.5 1.5 0 0 1 4 14.5v-8z"/></svg>Сообщество</button>
    <button data-tab="live"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 4h12l-2.5 4 2.5 4H6"/></svg>Live</button>
    <button data-tab="standings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg>Зачёт</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20c.8-4 4-6 7.5-6s6.7 2 7.5 6"/></svg>Профиль</button>
  </nav>
  <script src="/app.js"></script>
</body>
</html>
